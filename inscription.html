<form action="">
    <fieldset>
        <legend>Formulaire d'inscription</legend>

        <label for="nom">nom :</label>
        <input type="text" placeholder="entrer votre nom"><br><br>

        <label for="prenom">prenom :</label>
        <input type="text" placeholder="entrer votre prenom"><br><br>

        <label for="age">age :</label>
        <input type="number" min="10" max="18"><br><br>

        <label for="sex">sex :</label>
        <input type="radio" name="sex"  value="homme"> homme
        <input type="radio" name="sex"  value="femme"> femme
        <br><br>

        <label>langue preferes :</label><br>
        <input type="checkbox" value="HTML"> HTML
        <input type="checkbox" value="CSS"> CSS
        <input type="checkbox" value="JavaScript">JavaScript<br><br>

        <label>votre niveau :</label>
        <select>
            <option>1 eme</option>
            <option selected>2 eme</option>
            <option>3 eme</option>
        </select>
        <br><br>

        <label>remarque :</label><br>
        <textarea name="remarque" cols="30" rows="10" placeholder="votre avis"></textarea>
        <br><br>

        <input type="submit" value="envoyer">
        <input type="reset" value="Annuler">

    </fieldset>
</form>
